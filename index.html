<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulador de atendimento Bling</title>
  <link rel="icon" type="image/webp" href="data:image/webp;base64,UklGRhgBAABXRUJQVlA4IAwBAABQBgCdASocABwAPtEutFooIagoGAEAGglsAJ05QVAeKdIttoJpcIiAVrQEOiD9NQUPLkXIzloxps/iAAD+6yUi6WIqTWci/zq75cf9qIe9NBnZCnobFQl73Uqy/XggaTnZ3rl7bgt/iMeS/4aY65KyAiNPrAY74tTbxzBRa/d48kF3yXTLJMiPk+uJBbyP6ub3ajnvlGt1P0/7M+zX6sOwdnN90fKOrCNPZF24XxSg+tr19uxO5itgxFPhrK6Xw//r3/1gz80RnGtPxBNW+NJbCiaYzygbvLCv+JRwcpSX2W1U2iXbATuuJcu0EfWNqbEFX9LjvbrtRTeELXVwlXvYPl9dwd6IgDj4AAAA">
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#1f2937;color:#fff}
    body{display:grid;place-items:center;min-height:100vh}
    .loading{text-align:center;padding:24px}.loading strong{display:block;font-size:20px;margin-bottom:8px}.loading span{font-size:14px;color:#cbd5e1}
  </style>
</head>
<body>
  <div class="loading"><strong>Carregando simulador...</strong><span>Aguarde um instante.</span></div>
  <script>
    (async () => {
      try {
        const files = [
          'deploy/v20260916c_part1.txt',
          'deploy/v20260916c_part2.txt',
          'deploy/v20260916c_part3.txt'
        ];
        const parts = await Promise.all(files.map(async file => {
          const response = await fetch(file + '?v=20260916c');
          if (!response.ok) throw new Error('Falha ao carregar ' + file);
          return (await response.text()).trim();
        }));
        const b64 = parts.join('');
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        if (!('DecompressionStream' in window)) throw new Error('Navegador sem suporte à descompactação necessária.');
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="loading"><strong>Não foi possível carregar o simulador.</strong><span>' + error.message + '</span></div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
