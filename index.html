<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de Atendimento Bling - Chat</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#1f2937;color:#fff}
    body{display:grid;place-items:center;min-height:100vh}
    .loading{text-align:center;padding:24px}
    .loading strong{display:block;font-size:20px;margin-bottom:8px}
    .loading span{color:#bbf7d0;font-size:13px}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <strong>Simulador de Atendimento Bling</strong>
    <span>Carregando ambiente de treinamento...</span>
  </div>

  <script>
    (async () => {
      try {
        const files = Array.from({length: 8}, (_, i) => `assets/html/part${i + 1}.txt`);
        const responses = await Promise.all(files.map(path => fetch(path, {cache: 'no-store'})));

        for (const response of responses) {
          if (!response.ok) throw new Error(`Falha ao carregar ${response.url}`);
        }

        const parts = await Promise.all(responses.map(response => response.text()));
        const html = parts.join('');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        const loading = document.getElementById('loading');
        if (loading) {
          loading.innerHTML = '<strong>Não foi possível carregar o simulador.</strong><span>Atualize a página e tente novamente.</span>';
        }
      }
    })();
  </script>
</body>
</html>
